name: Update Sermons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-sermons.yml"
      - "scripts/update-sermons.mjs"
      - "live-status-state.js"
      - "script.js"
      - "test/**"
      - ".env.example"
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: update-sermons-feed
  cancel-in-progress: false

env:
  PRODUCTION_SITE_URL: https://graciasobregracia.onrender.com
  GITHUB_PAGES_SITE_URL: https://graciasobregracia.github.io/Iglesia

jobs:
  update-sermons:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test live status and end-to-end pipeline
        run: node --test test/*.test.cjs

      - name: Update sermons feed
        id: update-feed
        run: node scripts/update-sermons.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit data changes
        id: commit-data
        if: ${{ always() && steps.update-feed.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predicaciones.json data/live-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update sermons feed"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ always() && steps.update-feed.outcome == 'success' && steps.commit-data.outcome == 'success' && steps.commit-data.outputs.changed == 'true' }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured; production deploy was not triggered."
            exit 1
          fi

          if ! curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null 2>/dev/null; then
            echo "::error::Render deploy hook failed; response details were redacted."
            exit 1
          fi
          echo "Render deploy hook accepted the update."
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Verify deployed JSON on Render and GitHub Pages
        if: ${{ always() && steps.update-feed.outcome == 'success' && steps.commit-data.outcome == 'success' && steps.commit-data.outputs.changed == 'true' }}
        run: |
          expected_live=$(jq -cS . data/live-status.json)
          expected_sermons=$(jq -cS . data/predicaciones.json)
          all_match=false
          for attempt in $(seq 1 9); do
            all_match=true
            for host in "$PRODUCTION_SITE_URL" "$GITHUB_PAGES_SITE_URL"; do
              for file in live-status.json predicaciones.json; do
                expected="$expected_live"
                if [ "$file" = "predicaciones.json" ]; then expected="$expected_sermons"; fi
                response=$(curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                  "$host/data/$file?verify=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)
                actual=$(printf '%s' "$response" | jq -cS . 2>/dev/null || true)
                if [ "$actual" != "$expected" ]; then
                  echo "Waiting for $host/data/$file to match the generated JSON (attempt $attempt)."
                  all_match=false
                else
                  echo "$host/data/$file matches the generated JSON."
                fi
              done
            done
            if [ "$all_match" = "true" ]; then exit 0; fi
            sleep 10
          done

          echo "::error::Render or GitHub Pages JSON did not match the generated files after deployment."
          exit 1
