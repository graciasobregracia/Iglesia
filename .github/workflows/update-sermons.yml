name: Update Sermons

on:
  workflow_dispatch:
    inputs:
      diagnose_video_id:
        description: "Optional videoId to inspect videos.list without writing JSON"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-sermons.yml"
      - "scripts/update-sermons.mjs"
      - "live-status-state.js"
      - "script.js"
      - "test/**"
      - ".env.example"
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: update-sermons-feed
  cancel-in-progress: false

jobs:
  update-sermons:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test live status and end-to-end pipeline
        run: node --test test/*.test.cjs

      - name: Diagnose one YouTube video
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_video_id != '' }}
        run: node scripts/update-sermons.mjs --diagnose-video "$VIDEO_ID"
        env:
          VIDEO_ID: ${{ inputs.diagnose_video_id }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Update sermons feed
        id: update-feed
        run: node scripts/update-sermons.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit data changes
        id: commit-data
        if: ${{ steps.update-feed.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predicaciones.json data/live-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update sermons feed"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify committed JSON is served from the Git branch
        if: ${{ always() && steps.update-feed.outcome == 'success' && steps.commit-data.outcome == 'success' && steps.commit-data.outputs.changed == 'true' }}
        run: |
          expected_live=$(jq -cS . data/live-status.json)
          expected_sermons=$(jq -cS . data/predicaciones.json)
          all_match=false
          for attempt in $(seq 1 9); do
            all_match=true
            for file in live-status.json predicaciones.json; do
              expected="$expected_live"
              if [ "$file" = "predicaciones.json" ]; then expected="$expected_sermons"; fi
              response=$(curl -fsS \
                "https://raw.githubusercontent.com/graciasobregracia/Iglesia/main/data/$file?verify=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)
              actual=$(printf '%s' "$response" | jq -cS . 2>/dev/null || true)
              if [ "$actual" != "$expected" ]; then
                echo "Waiting for raw GitHub /data/$file to match the committed JSON (attempt $attempt)."
                all_match=false
              else
                echo "raw GitHub /data/$file matches the committed JSON."
              fi
            done
            if [ "$all_match" = "true" ]; then exit 0; fi
            sleep 10
          done

          echo "::error::raw GitHub JSON did not match the committed files."
          exit 1
